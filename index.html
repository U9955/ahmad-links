function avatarFallback(){
  const box = document.getElementById('avatarBox');
  box.innerHTML = `<span id="avatarText">${(PROFILE.name||'U').slice(0,2).toUpperCase()}</span>`;
}
function applyProfile(){
  if(document.getElementById('siteName')) document.getElementById('siteName').textContent = PROFILE.name;
  document.getElementById('siteUser').textContent = PROFILE.username;
  document.getElementById('siteBio').innerHTML = PROFILE.bio;
  const box = document.getElementById('avatarBox');
  if(PROFILE.avatarImg){
    box.innerHTML = `<img src="${PROFILE.avatarImg}" alt="logo" onerror="avatarFallback()" style="width:100%;height:100%;object-fit:cover;border-radius:26px;position:relative;z-index:1">`;
  } else {
    box.innerHTML = `<span id="avatarText">${(PROFILE.name||'U').slice(0,2).toUpperCase()}</span>`;
  }
  document.getElementById('editName') && (document.getElementById('editName').value = PROFILE.name);
  document.getElementById('editUser') && (document.getElementById('editUser').value = PROFILE.username);
  document.getElementById('editBio') && (document.getElementById('editBio').value = (PROFILE.bio||'').replace(/<br>/g,' '));
  if(document.getElementById('editAvatarUrl')) document.getElementById('editAvatarUrl').value = PROFILE.avatarImg||'';
  document.title = PROFILE.name + " | Space Links";
}
function renderLinks(filter=''){
  const box = document.getElementById('linksBox');
  const q = filter.toLowerCase();
  const list = LINKS.filter(l => (l.platform+l.user).toLowerCase().includes(q));
  box.innerHTML = list.map((l,i)=>`
    <a class="link" style="--c:${l.color}" href="${l.url}" target="_blank" rel="noopener">
      <div class="icon"><i class="${l.icon}"></i></div>
      <div class="link-info"><b>${l.platform} ${l.hot?'<span class="badge">HOT</span>':''}</b><small>${l.user} • ${l.desc||''}</small></div>
      <button class="copy" onclick="event.preventDefault();copyLink('${l.url}','${l.platform}')"><i class="fa-regular fa-copy"></i></button>
      <div class="go"><i class="fa-solid fa-arrow-right"></i></div>
    </a>`).join('') || `<div style="text-align:center;color:var(--muted);padding:20px">No results 🪐</div>`;
  document.getElementById('statLinks') && (document.getElementById('statLinks').textContent = LINKS.length);
  renderEditor();
}
function renderEditor(){
  const e = document.getElementById('editLinks');
  if(!e) return;
  e.innerHTML = LINKS.map((l,i)=>`
    <div class="edit-row">
      <input value="${l.platform}" disabled style="max-width:90px;opacity:.7">
      <input value="${l.url}" oninput="updateLink(${i},this.value)" placeholder="https://...">
    </div>`).join('');
}
function updateLink(i,v){ LINKS[i].url=v; store.set('links',LINKS); renderLinks(document.getElementById('searchInput').value); }
function filterLinks(v){ renderLinks(v); }
function saveProfile(){
  PROFILE = { name:editName.value||'U9955', username:editUser.value||'@u9955', bio:editBio.value||'', avatarImg:PROFILE.avatarImg||'' };
  store.set('profile',PROFILE); applyProfile(); toast('Profile saved ✅');
}
function uploadLogo(e){
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 2.5*1024*1024){ toast('File too big! Max 2.5MB ⚠️'); return; }
  const r = new FileReader();
  r.onload = function(){ PROFILE.avatarImg = r.result; store.set('profile',PROFILE); applyProfile(); toast('Logo / GIF added ✅'); };
  r.readAsDataURL(f);
}
function saveAvatarUrl(){
  const v = document.getElementById('editAvatarUrl').value.trim();
  PROFILE.avatarImg = v; store.set('profile',PROFILE); applyProfile(); toast(v?'Logo link saved ✅':'Logo removed');
}
function removeLogo(){ PROFILE.avatarImg=''; store.set('profile',PROFILE); applyProfile(); toast('Logo removed'); }
function resetAll(){ localStorage.clear(); location.reload(); }

/* themes + fonts - GIF theme: white + hair purple + eye red */
const THEMES = {
  neon:{a:'#6d28d9',b:'#8b5cf6',c:'#dc2626',bg:'#fdfbff',border:'rgba(109,40,217,.22)'},
  cyber:{a:'#6d28d9',b:'#a78bfa',c:'#dc2626',bg:'#faf7ff',border:'rgba(109,40,217,.22)'},
  mars:{a:'#991b1b',b:'#dc2626',c:'#6d28d9',bg:'#fff7f7',border:'rgba(220,38,38,.25)'},
  matrix:{a:'#4c1d95',b:'#7c3aed',c:'#b91c1c',bg:'#f8f5ff',border:'rgba(76,29,149,.22)'},
};
function setTheme(name,el){
  const t=THEMES[name]; if(!t) return;
  document.documentElement.style.setProperty('--accent',t.a);
  document.documentElement.style.setProperty('--accent2',t.b);
  document.documentElement.style.setProperty('--accent3',t.c);
  document.documentElement.style.setProperty('--border',t.border);
  document.body.style.background=t.bg;
  document.querySelectorAll('.theme').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  store.set('theme',name); toast('Theme: '+name+' 🎨');
}
const FONTS = {
  orbitron:["'Orbitron',sans-serif","'Space Grotesk',sans-serif"],
  poppins:["'Poppins',sans-serif","'Poppins',sans-serif"],
  cairo:["'Cairo',sans-serif","'Cairo',sans-serif"],
  inter:["'Inter',sans-serif","'Inter',sans-serif"],
};
function setFont(name){
  const f=FONTS[name]||FONTS.orbitron;
  document.documentElement.style.setProperty('--font-head',f[0]);
  document.documentElement.style.setProperty('--font-body',f[1]);
  store.set('font',name);
}

/* actions */
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function copyLink(url,plat){ navigator.clipboard.writeText(url); toast(plat+' link copied ✅'); }
function copyProfile(){ navigator.clipboard.writeText(location.href); toast('Profile link copied ✅'); }
function shareSite(){ if(navigator.share){navigator.share({title:PROFILE.name, text:'Follow '+PROFILE.name+' 🪐', url:location.href})} else{copyProfile()} }
function togglePanel(force){
  const p=document.getElementById('panel');
  const open = force!==undefined?force:!p.classList.contains('open');
  p.classList.toggle('open',open);
}

/* music - local file: music.mp3 (loop) | الزر = كتم / تشغيل الصوت */
let musicOn = false;
function musicEl(){ return document.getElementById('bgMusic'); }
function paintMusicBtn(){
  const btn = document.getElementById('musicBtn');
  if(!btn) return;
  const a = musicEl();
  const muted = a && a.muted;
  if(musicOn && !muted){ btn.classList.add('playing'); btn.innerHTML = '<i class="fa-solid fa-compact-disc"></i>'; }
  else if(musicOn && muted){ btn.classList.remove('playing'); btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>'; }
  else { btn.classList.remove('playing'); btn.innerHTML = '<i class="fa-solid fa-music"></i>'; }
}
function tryStartMusic(){
  const a = musicEl(); if(!a) return;
  if(a.paused){
    try{ a.muted = false; }catch(_){}
    const p = a.play();
    if(p && p.catch) p.catch(function(){});
  } else if(a.muted){
    try{ a.muted = false; }catch(_){}
  }
}
function toggleMusic(){
  const a = musicEl(); if(!a) return;
  if(a.paused){ tryStartMusic(); toast('Sound on 🔊'); }
  else {
    a.muted = !a.muted;
    paintMusicBtn();
    toast(a.muted ? 'Muted 🔇' : 'Sound on 🔊');
  }
}
// تشغيل فوري عند الدخول + أول تفاعل (المتصفح قد يمنع الصوت قبل أول لمسة/زر)
tryStartMusic();
addEventListener('pointerdown', tryStartMusic, {passive:true});
addEventListener('keydown', tryStartMusic);
addEventListener('touchend', tryStartMusic, {passive:true});
(function(){
  const a = musicEl(); if(!a) return;
  a.volume = 0.7;
  try{ a.muted = false; }catch(_){}
  a.addEventListener('play', function(){ musicOn = true; paintMusicBtn(); });
  a.addEventListener('pause', function(){ musicOn = false; paintMusicBtn(); });
  a.addEventListener('volumechange', paintMusicBtn);
  a.addEventListener('error', function(){ musicOn = false; paintMusicBtn(); });
})();

/* stars */
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');
let stars=[];
function initStars(){
  cv.width=innerWidth;cv.height=innerHeight;
  stars=Array.from({length:240},()=>{
    const roll = Math.random();
    const kind = roll<0.14 ? 'red' : roll<0.30 ? 'petal' : roll<0.42 ? 'white' : 'purple';
    return {x:Math.random()*cv.width,y:Math.random()*cv.height,
      r: kind==='petal' ? Math.random()*4+3 : Math.random()*2+.6,
      s: kind==='petal' ? Math.random()*.7+.35 : Math.random()*.9+.3,
      vx:(Math.random()-.5)*(kind==='petal'?.7:.3),
      tw:Math.random()*Math.PI*2, rot:Math.random()*Math.PI*2, vr:(Math.random()-.5)*.03, kind};
  });
}
function drawStars(){
  ctx.clearRect(0,0,cv.width,cv.height);
  stars.forEach(st=>{
    st.tw+=.04; st.y+=st.s; st.x+=st.vx+Math.sin(st.tw)*.2; st.rot+=st.vr;
    if(st.y>cv.height+12){st.y=-12;st.x=Math.random()*cv.width} if(st.x>cv.width+12)st.x=-12; if(st.x<-12)st.x=cv.width+12;
    const a = st.kind==='white' ? .5+Math.abs(Math.sin(st.tw))*.5 : .28+Math.abs(Math.sin(st.tw))*.5;
    if(st.kind==='petal'){
      ctx.save();ctx.translate(st.x,st.y);ctx.rotate(st.rot);
      ctx.beginPath();ctx.ellipse(0,0,st.r,st.r*.55,0,0,7);
      ctx.fillStyle=`rgba(139,92,246,${a})`;ctx.fill();
      ctx.shadowBlur=6;ctx.shadowColor='#8b5cf6';
      ctx.restore();ctx.shadowBlur=0;
    } else {
      ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);
      ctx.fillStyle = st.kind==='red' ? `rgba(220,38,38,${a})` : st.kind==='white' ? `rgba(255,255,255,${a})` : `rgba(109,40,217,${a})`;
      ctx.fill();
      if(st.r>1.5){ctx.shadowBlur=8;ctx.shadowColor=st.kind==='red'?'#dc2626':'#8b5cf6'}else{ctx.shadowBlur=0}
    }
  });
  requestAnimationFrame(drawStars);
}
addEventListener('resize',initStars);

/* shooting stars */
function shoot(){
  const el=document.createElement('div');el.className='shoot';
  el.style.top=Math.random()*30+'%';el.style.left=(40+Math.random()*55)+'%';
  document.body.appendChild(el);
  el.animate([{opacity:1,transform:'rotate(-25deg) translateX(0)'},{opacity:0,transform:'rotate(-25deg) translateX(-400px)'}],{duration:1100,easing:'ease-out'}).onfinish=()=>el.remove();
  setTimeout(shoot,2500+Math.random()*4000);
}

/* init */
if(document.getElementById('year')) document.getElementById('year').textContent=new Date().getFullYear();
applyProfile(); renderLinks();
const sv=store.get('theme',null); if(sv && document.querySelector(`.theme[onclick*="${sv}"]`)) setTheme(sv,document.querySelector(`.theme[onclick*="${sv}"]`));
const sf=store.get('font',null); if(sf && document.getElementById('fontSelect')){document.getElementById('fontSelect').value=sf; setFont(sf);}
let views=store.get('views',0)+1; store.set('views',views);
if(document.getElementById('statViews')) document.getElementById('statViews').textContent=views>1000?(views/1000).toFixed(1)+'k':views;
initStars(); drawStars(); shoot();
</script>
